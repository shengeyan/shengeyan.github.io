<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Blog 管理后台</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #24292f; --muted: #57606a;
      --border: #d0d7de; --accent: #0969da; --accent-h: #0550ae;
      --danger: #cf222e; --ok: #1a7f37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    .hidden { display: none !important; }
    a { color: var(--accent); }
    button {
      cursor: pointer; border: 1px solid var(--border); background: #f6f8fa;
      color: var(--text); padding: 7px 14px; border-radius: 6px; font-size: 14px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-h); }
    button.danger { color: var(--danger); border-color: var(--danger); background: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea, select {
      border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
      font-size: 14px; width: 100%; font-family: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border);
    }
    .topbar .brand { font-weight: 700; font-size: 16px; }
    .topbar .user { color: var(--muted); font-size: 14px; display: flex; gap: 12px; align-items: center; }
    #loginView { max-width: 400px; margin: 80px auto; text-align: center; }
    #loginView .card { padding: 40px 32px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .post-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); margin-bottom: 8px; cursor: pointer;
    }
    .post-item:hover { border-color: var(--accent); }
    .post-item .t { font-weight: 600; }
    .post-item .d { color: var(--muted); font-size: 12px; }
    .editor-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fields .full { grid-column: 1 / -1; }
    label { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
    #bodyEditor { min-height: 360px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; }
    .preview {
      background: #fff; border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; min-height: 200px; overflow: auto;
    }
    .preview h1, .preview h2, .preview h3 { margin: 16px 0 8px; }
    .preview p { margin: 8px 0; }
    .preview code { background: #f0f3f6; padding: 2px 5px; border-radius: 4px; }
    .preview pre { background: #f6f8fa; padding: 12px; border-radius: 8px; overflow: auto; }
    .preview img { max-width: 100%; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #000; color: #fff;
      padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s;
    }
    .toast.show { opacity: 1; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .empty { text-align: center; color: var(--muted); padding: 40px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>

  <!-- 登录视图 -->
  <div id="loginView" class="hidden">
    <div class="card">
      <h1 style="margin-bottom:12px;">Blog 管理后台</h1>
      <p style="color:var(--muted);margin-bottom:24px;">通过 GitHub 账号授权登录。仅仓库所有者/协作者可发布文章。</p>
      <button class="primary" id="loginBtn" style="width:100%;padding:12px;">使用 GitHub 登录</button>
      <p class="hint" style="margin-top:12px;">登录后需具备 blog-code 仓库写权限才能发布。</p>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="mainView" class="hidden">
    <div class="topbar">
      <div>
        <span class="brand">Blog 管理后台</span>
      </div>
      <div class="user">
        <span id="userName"></span>
        <button id="logoutBtn">退出登录</button>
      </div>
    </div>
    <div class="wrap">

      <!-- 列表视图 -->
      <div id="listView">
        <div class="list-head">
          <h2>文章列表</h2>
          <button class="primary" id="newPostBtn">＋ 新建文章</button>
        </div>
        <div id="postList"></div>
      </div>

      <!-- 编辑器视图 -->
      <div id="editorView" class="hidden">
        <div class="list-head">
          <h2 id="editorTitle">编辑文章</h2>
          <button id="backBtn">← 返回列表</button>
        </div>
        <div class="card">
          <div class="fields">
            <div class="full">
              <label>标题</label>
              <input id="f_title" placeholder="文章标题">
            </div>
            <div>
              <label>日期</label>
              <input id="f_date" placeholder="YYYY-MM-DD HH:mm:ss">
            </div>
            <div>
              <label>abbrlink</label>
              <input id="f_abbrlink" placeholder="自动生成">
            </div>
            <div>
              <label>分类（英文逗号分隔）</label>
              <input id="f_categories" placeholder="前端, 架构">
            </div>
            <div>
              <label>标签（英文逗号分隔）</label>
              <input id="f_tags" placeholder="React, Vue">
            </div>
          </div>

          <div class="tabs" style="margin-top:16px;">
            <button id="tabWrite" class="active">编辑</button>
            <button id="tabPreview">预览</button>
          </div>
          <textarea id="bodyEditor" class="hidden" placeholder="Markdown 正文…"></textarea>
          <div id="bodyPreview" class="preview"></div>

          <div style="margin-top:16px;">
            <label>上传图片</label>
            <input type="file" id="fileInput" accept="image/*" multiple>
            <div class="hint">上传后图片 URL 会复制到剪贴板，可直接粘贴进正文。</div>
          </div>

          <div class="actions">
            <button class="danger" id="deleteBtn">删除</button>
            <button id="saveBtn" class="primary">保存并发布</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./api.js"></script>
  <script src="./frontmatter.js"></script>
  <script src="./main.js"></script>
</body>
</html>
